name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # latest = neuestes Release (Tag vX.Y.Z), edge = aktueller Stand von main.
          # So bekommen Installationen mit :latest nur freigegebene Versionen.
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          # keine Attestations ("unknown/unknown"-Einträge im Index): ältere
          # Docker-Versionen wie im Synology-Paket (20.10) kommen damit schlecht zurecht
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('main-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Version-Tags (vX.Y.Z): Programme für systemd-Installationen + Prüfsummen als
  # GitHub-Release. Selbst-Update und deploy/install.sh laden genau diese Dateien.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Programme bauen
        run: |
          mkdir dist
          # Dateiname  GOARCH  GOARM
          for spec in "amd64 amd64" "arm64 arm64" "armv7 arm 7"; do
            set -- $spec
            CGO_ENABLED=0 GOOS=linux GOARCH=$2 GOARM=${3:-} \
              go build -trimpath -tags timetzdata -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o dist/mikrotik-manager-linux-$1 .
          done
          cd dist && sha256sum mikrotik-manager-linux-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mikrotik-manager-linux-*
            dist/SHA256SUMS
            deploy/install.sh
          generate_release_notes: true
